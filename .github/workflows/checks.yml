# Lint, typecheck, tests (route tests included, on a throwaway Postgres) and
# the web build on every push and pull request.
# Render deploys main on push; set its Auto-Deploy to "After CI checks pass"
# so a red run never reaches production.
name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the server's route tests (server/src/routes/api.test.ts).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gainztracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gainztracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # what Render runs
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w server # the server's types come from the Prisma client
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
