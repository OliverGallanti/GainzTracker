# Lint, typecheck, tests and the web build on every push and pull request.
# Render deploys main on push; set its Auto-Deploy to "After CI checks pass"
# so a red run never reaches production.
name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # what Render runs
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w server # the server's types come from the Prisma client
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
